<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seeding">
<meta name="theme-color" content="#3f5d3f">
<title>Seeding calculator</title>
<style>
:root{--rule:#3f5d3f;--tint:#eef2ea;--warn:#a11d1d;--ink:#1a1c1e;--paper:#fbfaf4;
--line:#cfd8cc;--muted:#5d6360;}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);
font:16px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;}
header{background:var(--rule);color:#fff;padding:14px 16px;
padding-top:calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:20;}
header h1{margin:0;font-size:17px;font-weight:600;}
header p{margin:2px 0 0;font-size:12px;opacity:.8;}
main{padding:12px 12px calc(90px + env(safe-area-inset-bottom));max-width:780px;margin:0 auto;}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:10px 12px 12px;background:#fff;}
legend{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--rule);padding:0 5px;}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;
border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);}
input[type=number]{font-variant-numeric:tabular-nums;}
.row{display:flex;gap:8px;}.row>*{flex:1;min-width:0;}
button{font:inherit;font-size:15px;padding:10px 14px;border-radius:8px;border:1px solid var(--rule);
background:var(--rule);color:#fff;font-weight:600;-webkit-appearance:none;}
button.ghost{background:#fff;color:var(--rule);}
button.sm{font-size:13px;padding:7px 10px;}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-top:4px;}
.seg button{flex:1;border:0;border-radius:0;font-size:13px;padding:9px 6px;background:#fff;color:var(--rule);}
.seg button[aria-pressed=true]{background:var(--rule);color:#fff;}
.linecard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.linecard .hd{display:flex;gap:8px;align-items:center;}
.linecard .hd input{font-weight:700;}
.plate{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px;}
.plate .phd{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.plate .phd strong{flex:1;font-size:13px;color:var(--rule);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.well{border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:8px 6px;
min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;font-size:12px;line-height:1.25;cursor:pointer;}
.well.filled{border-color:var(--rule);background:var(--tint);}
.well .wn{font-size:10px;color:var(--muted);}
.well .wl{font-weight:700;margin-top:2px;}
.well .wv{font-variant-numeric:tabular-nums;}
.well .empty{color:var(--muted);}
dialog{border:0;border-radius:14px;padding:0;width:min(92vw,380px);
box-shadow:0 10px 40px rgba(0,0,0,.3);}
dialog::backdrop{background:rgba(0,0,0,.4);}
.dlg{padding:14px 16px 16px;}
.dlg h3{margin:0 0 8px;font-size:15px;color:var(--rule);}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.out{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 12px 12px;}
.out h2{font-size:15px;margin:14px 0 6px;color:var(--rule);}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0;display:block;overflow-x:auto;}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;white-space:nowrap;}
th{background:var(--tint);font-weight:600;}
td.num{text-align:right;font-variant-numeric:tabular-nums;}
.warn{color:var(--warn);font-weight:600;font-size:13px;}
.muted{color:var(--muted);font-size:12px;}
textarea#md{height:230px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre;}
.tabs{display:flex;gap:6px;margin:12px 0 8px;}
.tabs button{flex:1;font-size:13px;padding:8px;}
.tabs button[aria-selected=false]{background:#fff;color:var(--rule);}
.hidden{display:none;}
.note{background:var(--tint);border-left:3px solid var(--rule);padding:7px 10px;font-size:12.5px;margin:8px 0;}
</style>
</head>
<body>

<header>
  <h1>Seeding calculator</h1>
  <p>Multi-well plates · master seed → mixes → wells</p>
</header>

<main>

<fieldset>
  <legend>Session</legend>
  <div class="row">
    <div><label>Date</label><input type="date" id="date"></div>
    <div><label>Initials</label><input id="who" value="JACK"></div>
  </div>
  <label>Plate format</label>
  <select id="plate">
    <option value="6|2|3" selected>6-well — 2 mL/well</option>
    <option value="12|1|4">12-well — 1 mL/well</option>
    <option value="24|0.5|6">24-well — 0.5 mL/well</option>
  </select>
  <div class="row">
    <div><label>Volume per well (mL)</label><input type="number" id="wellvol" step="0.1" value="2"></div>
    <div><label>Wiggle room</label>
      <div class="seg" id="excessMode" style="margin-top:0">
        <button type="button" data-v="factor" aria-pressed="true">Factor</button>
        <button type="button" data-v="volume" aria-pressed="false">Volume</button>
      </div></div>
  </div>
  <div class="row">
    <div id="exFactorWrap"><label>Excess factor</label><input type="number" id="excess" step="0.05" value="1.4"></div>
    <div id="exVolWrap" class="hidden"><label>Excess volume (mL)</label><input type="number" id="excessVol" step="0.1" value="1"></div>
  </div>
  <label>Mix strategy</label>
  <div class="seg" id="strategy">
    <button type="button" data-v="per-conc" aria-pressed="true">One mix per concentration</button>
    <button type="button" data-v="per-line" aria-pressed="false">One mix per line</button>
  </div>
  <div class="note" id="stratnote"></div>
  <div class="row">
    <div><label>Min pipettable (mL)</label><input type="number" id="minvol" step="0.01" value="0.05"></div>
    <div><label>Round to (mL)</label><input type="number" id="round" step="0.01" value="0.1"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Cell lines</legend>
  <div id="lines"></div>
  <button class="ghost sm" id="addline" type="button">+ add cell line</button>
</fieldset>

<fieldset>
  <legend>Plate setup</legend>
  <p class="muted" style="margin:2px 0 8px">Tap a well to assign a line and a density.</p>
  <div id="plates"></div>
  <button class="ghost sm" id="addplate" type="button">+ add plate</button>
</fieldset>

<div class="actions">
  <button id="calc" type="button">Calculate</button>
  <button class="ghost" id="reset" type="button">Reset</button>
</div>

<div class="tabs">
  <button id="tabView" aria-selected="true" type="button">Readable</button>
  <button id="tabMd" aria-selected="false" type="button">Markdown</button>
</div>

<div id="viewPane" class="out"><p class="muted">Set up your plate and press Calculate.</p></div>

<div id="mdPane" class="hidden">
  <textarea id="md" readonly spellcheck="false"></textarea>
  <div class="actions">
    <button id="copy" type="button">Copy markdown</button>
    <button class="ghost" id="download" type="button">Download .md</button>
  </div>
  <p class="muted">Copy and paste into Obsidian, or Download and use the share sheet.</p>
</div>

</main>

<dialog id="wellDlg"><div class="dlg">
  <h3 id="dlgTitle">Well</h3>
  <label>Cell line</label>
  <select id="dlgLine"></select>
  <label>Specify by</label>
  <div class="seg" id="dlgMode">
    <button type="button" data-v="count" aria-pressed="true">Cell count</button>
    <button type="button" data-v="conc" aria-pressed="false">Concentration</button>
  </div>
  <label id="dlgValLabel">Cells in this well</label>
  <input type="number" id="dlgVal" step="1000" inputmode="numeric">
  <label>Also fill the next … wells with the same settings</label>
  <input type="number" id="dlgRep" step="1" min="1" value="1" inputmode="numeric">
  <div class="actions">
    <button id="dlgOk" type="button">Set</button>
    <button class="ghost" id="dlgClear" type="button">Clear well</button>
    <button class="ghost" id="dlgCancel" type="button">Cancel</button>
  </div>
</div></dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);

let LINES = [];
let PLATES = [];
let strategy = "per-conc";
let excessMode = "factor";
let dlgMode = "count", dlgTarget = null;

const NOTES = {
  "per-conc": "One universal per distinct density within a line. Each mix is made at the final plating density, so every well of that density gets the same volume and no top-up media. More universals, less pipetting per well.",
  "per-line": "One universal per line, made at the highest density on the plate. Lower-density wells get less of that mix plus top-up media. Fewer universals, but a media addition to most wells if there are multiple concentrations."
};

const fmt = (n,dp=2) => !isFinite(n) ? "\u2014" : Number(n).toFixed(dp).replace(/\.?0+$/, m => m.includes(".")?"":m);
const fmtCells = n => (!isFinite(n)||!n) ? "0" : (n>=1000 ? (n/1000).toFixed(n%1000===0?0:1)+"k" : String(Math.round(n)));
const roundTo = (v,s) => (!s||s<=0) ? v : Math.round(v/s)*s;
const cfg = () => ({
  n: parseInt($("plate").value.split("|")[0],10),
  cols: parseInt($("plate").value.split("|")[2],10),
  wellVol: parseFloat($("wellvol").value)||2,
  excessMode: excessMode,
  excess: parseFloat($("excess").value)||1,
  excessVol: parseFloat($("excessVol").value)||0,
  minVol: parseFloat($("minvol").value)||0,
  step: parseFloat($("round").value)||0
});
const addExcess = (v,c) => c.excessMode==="factor" ? v*c.excess : v + c.excessVol;
const wellCells = (w,wellVol) => !w ? 0 : (w.mode==="conc" ? w.val*wellVol : w.val);

const MEDIA = ["RPMI (complete)","Keratinocyte SFM (complete)","Other / custom"];
const KSFM_LINES = ["cp-a","cpa","epc2","epc2-htert"];
function defaultMedia(name){
  const n = (name||"").toLowerCase().replace(/\s+/g,"");
  return KSFM_LINES.some(k => n.indexOf(k.replace(/-/g,""))>-1 || n===k) ? MEDIA[1] : MEDIA[0];
}
function mediaWarn(el,l){
  const box = el.querySelector(".mdwarn"); if (!box) return;
  const expect = defaultMedia(l.name);
  if (l.name && l.media && l.media !== expect && l.media !== MEDIA[2])
    box.innerHTML = '<p class="warn" style="margin:4px 0 0">Unusual: '+l.name+' is normally grown in '+expect+'.</p>';
  else box.innerHTML = "";
}

function renderLines(){
  $("lines").innerHTML = "";
  LINES.forEach((l,i) => {
    const d = document.createElement("div");
    d.className = "linecard";
    d.innerHTML =
      '<div class="hd"><input class="nm" placeholder="Cell line name" value="'+(l.name||"")+'">'+
      '<button class="ghost sm rm" type="button">remove</button></div>'+
      '<label>Media</label><select class="md">'+MEDIA.map(function(x){return '<option'+(l.media===x?" selected":"")+'>'+x+'</option>';}).join("")+'</select>'+
      '<div class="mdwarn"></div>'+
      '<div class="row"><div><label>Master seed conc (cells/mL)</label>'+
      '<input type="number" class="cc" step="1000" value="'+(l.conc||"")+'" placeholder="550000"></div>'+
      '<div><label>Master seed vol (mL)</label>'+
      '<input type="number" class="mv" step="0.5" value="'+(l.mvol||"")+'" placeholder="10"></div></div>';
    d.querySelector(".nm").oninput = e => { l.name = e.target.value; l.media = l.media || defaultMedia(l.name); mediaWarn(d,l); renderPlates(); };
    d.querySelector(".md").onchange = e => { l.media = e.target.value; mediaWarn(d,l); };
    mediaWarn(d,l);
    d.querySelector(".cc").oninput = e => l.conc = parseFloat(e.target.value)||0;
    d.querySelector(".mv").oninput = e => l.mvol = parseFloat(e.target.value)||0;
    d.querySelector(".rm").onclick = () => {
      const nm = LINES[i].name;
      LINES.splice(i,1);
      PLATES.forEach(p => p.forEach((w,j) => { if (w && w.line===nm) p[j]=null; }));
      renderLines(); renderPlates();
    };
    $("lines").appendChild(d);
  });
}

function renderPlates(){
  const c = cfg();
  $("plates").innerHTML = "";
  PLATES.forEach((plate,pi) => {
    while (plate.length < c.n) plate.push(null);
    plate.length = c.n;
    const box = document.createElement("div");
    box.className = "plate";
    const cells = plate.map((w,wi) => {
      if (!w) return '<div class="well" data-p="'+pi+'" data-w="'+wi+'"><div class="wn">'+(wi+1)+'</div><div class="empty">empty</div></div>';
      const v = w.mode==="conc" ? fmtCells(w.val)+"/mL" : fmtCells(w.val);
      return '<div class="well filled" data-p="'+pi+'" data-w="'+wi+'"><div class="wn">'+(wi+1)+
             '</div><div class="wl">'+w.line+'</div><div class="wv">'+v+'</div></div>';
    }).join("");
    box.innerHTML =
      '<div class="phd"><strong>Plate '+(pi+1)+' of '+PLATES.length+'</strong>'+
      (PLATES.length>1?'<button class="ghost sm rmp" type="button">remove</button>':'')+
      '<button class="ghost sm dup" type="button">duplicate</button></div>'+
      '<div class="grid" style="grid-template-columns:repeat('+c.cols+',1fr)">'+cells+'</div>';
    box.querySelectorAll(".well").forEach(el => el.onclick = () => openWell(+el.dataset.p, +el.dataset.w));
    const rmp = box.querySelector(".rmp");
    if (rmp) rmp.onclick = () => { PLATES.splice(pi,1); renderPlates(); };
    box.querySelector(".dup").onclick = () => { PLATES.splice(pi+1,0, plate.map(w => w?Object.assign({},w):null)); renderPlates(); };
    $("plates").appendChild(box);
  });
}

function openWell(pi,wi){
  dlgTarget = {pi:pi,wi:wi};
  const cur = PLATES[pi][wi];
  const named = LINES.filter(l => l.name);
  if (!named.length){ alert("Add a cell line first."); return; }
  $("dlgTitle").textContent = "Plate "+(pi+1)+" \u00b7 well "+(wi+1);
  $("dlgLine").innerHTML = named.map(l => '<option'+(cur&&cur.line===l.name?" selected":"")+'>'+l.name+'</option>').join("");
  setDlgMode(cur ? cur.mode : "count");
  $("dlgVal").value = cur ? cur.val : "";
  $("dlgRep").value = 1;
  $("wellDlg").showModal();
}
function setDlgMode(m){
  dlgMode = m;
  $("dlgMode").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v===m)));
  $("dlgValLabel").textContent = m==="conc" ? "Concentration in this well (cells/mL)" : "Cells in this well";
}

function compute(){
  const c = cfg();
  const warnings = [];
  const used = {};
  PLATES.forEach((p,pi) => p.forEach((w,wi) => {
    if (!w) return;
    (used[w.line] = used[w.line] || []).push({pi:pi, wi:wi, cells: wellCells(w,c.wellVol)});
  }));

  const lines = LINES.filter(l => l.name && used[l.name] && l.conc>0).map(l => {
    const wells = used[l.name];
    const mixes = [];

    if (strategy === "per-conc"){
      const groups = {};
      wells.forEach(w => (groups[w.cells] = groups[w.cells] || []).push(w));
      Object.keys(groups).map(Number).sort((a,b)=>b-a).forEach(cellsN => {
        const g = groups[cellsN];
        const total = roundTo(addExcess(c.wellVol * g.length, c), c.step);
        const seedRaw = (total * (cellsN / c.wellVol)) / l.conc;
        const seed = roundTo(seedRaw, c.step);
        const media = Math.max(0, roundTo(total - seed, c.step));
        if (seedRaw > total) warnings.push(l.name+" at "+fmtCells(cellsN)+"/well: needs "+fmt(seedRaw)+" mL of master seed for a "+fmt(total)+" mL mix. Master seed too dilute \u2014 respin into less media.");
        else if (seedRaw < c.minVol) warnings.push(l.name+" at "+fmtCells(cellsN)+"/well: only "+fmt(seedRaw,3)+" mL of master seed needed, below the "+fmt(c.minVol,2)+" mL floor. Make an intermediate dilution.");
        mixes.push({label:l.name+" "+fmtCells(cellsN), cellsPerWell:cellsN, wells:g, total:total, seed:seed, media:media});
      });
    } else {
      const maxCells = Math.max.apply(null, wells.map(w=>w.cells));
      const mixConc = maxCells / c.wellVol;
      const rows = wells.map(w => {
        const volRaw = w.cells / mixConc;
        return {pi:w.pi, wi:w.wi, cells:w.cells, volRaw:volRaw,
                vol: roundTo(volRaw, c.step),
                topUp: Math.max(0, roundTo(c.wellVol - volRaw, c.step))};
      });
      const total = roundTo(addExcess(rows.reduce((a,r)=>a+r.volRaw,0), c), c.step);
      const seedRaw = (total * mixConc) / l.conc;
      const seed = roundTo(seedRaw, c.step);
      const media = Math.max(0, roundTo(total - seed, c.step));
      if (seedRaw > total) warnings.push(l.name+": master seed ("+l.conc.toLocaleString("en-GB")+"/mL) is more dilute than the mix needs ("+Math.round(mixConc).toLocaleString("en-GB")+"/mL). Respin into less media.");
      rows.forEach(r => { if (r.volRaw>0 && r.volRaw < c.minVol)
        warnings.push(l.name+" plate "+(r.pi+1)+" well "+(r.wi+1)+": "+fmt(r.volRaw,3)+" mL of mix is below the "+fmt(c.minVol,2)+" mL floor."); });
      mixes.push({label:l.name+" single mix", mixConc:mixConc, wells:rows, rows:rows, total:total, seed:seed, media:media});
    }

    const totalSeed = mixes.reduce((a,m)=>a+m.seed,0);
    if (l.mvol>0 && totalSeed > l.mvol)
      warnings.push(l.name+": needs "+fmt(totalSeed)+" mL of master seed but you have "+fmt(l.mvol)+" mL.");
    return {name:l.name, media:l.media, conc:l.conc, mvol:l.mvol, wells:wells, mixes:mixes, totalSeed:totalSeed};
  });

  return {c:c, lines:lines, warnings:warnings};
}

function buildMarkdown(r){
  const date = $("date").value || new Date().toISOString().slice(0,10);
  const who = $("who").value.trim();
  const banner = (date+" "+who).trim();
  const c = r.c, m = [];

  m.push("# Seeding \u2014 "+banner); m.push("");
  m.push("## Session"); m.push("");
  m.push("| Setting | Value |"); m.push("| --- | --- |");
  m.push("| Date | "+date+" |");
  m.push("| Operator | "+who+" |");
  m.push("| Plate format | "+c.n+"-well \u00b7 "+PLATES.length+" plate"+(PLATES.length>1?"s":"")+" |");
  m.push("| Volume per well | "+fmt(c.wellVol)+" mL |");
  m.push("| Excess factor | "+(c.excessMode==="factor"?fmt(c.excess):"\u2014")+" |");
  m.push("| Excess volume | "+(c.excessMode==="volume"?fmt(c.excessVol)+" mL":"\u2014")+" |");
  m.push("| Mix strategy | "+(strategy==="per-conc"?"One mix per concentration":"One mix per line")+" |");
  m.push("| Min pipettable | "+fmt(c.minVol,2)+" mL |");
  m.push("| Rounding | "+fmt(c.step,2)+" mL |");
  m.push("");

  m.push("## Cell lines"); m.push("");
  m.push("| Line | Media | Master seed conc (cells/mL) | Available (mL) | Used (mL) |");
  m.push("| --- | --- | ---: | ---: | ---: |");
  r.lines.forEach(l => m.push("| "+l.name+" | "+(l.media||"\u2014")+" | "+l.conc.toLocaleString("en-GB")+" | "+(l.mvol?fmt(l.mvol):"\u2014")+" | "+fmt(l.totalSeed)+" |"));
  m.push("");

  if (r.warnings.length){
    m.push("## Check these"); m.push("");
    r.warnings.forEach(w => m.push("- "+w)); m.push("");
  }

  m.push("## How to make up the mixes"); m.push("");
  m.push("Label each universal top and side. Add **media first**, then master seed. Resuspend the master seed immediately before drawing from it.");
  m.push("");
  m.push("| Mix | Media (mL) | Master seed (mL) | Total (mL) | For |");
  m.push("| --- | ---: | ---: | ---: | --- |");
  r.lines.forEach(l => l.mixes.forEach(mx => {
    const forTxt = (strategy==="per-conc")
      ? (mx.wells.length+" well"+(mx.wells.length>1?"s":"")+" at "+fmtCells(mx.cellsPerWell))
      : ("all "+mx.wells.length+" wells, mix at "+Math.round(mx.mixConc).toLocaleString("en-GB")+"/mL");
    m.push("| "+mx.label+" | "+fmt(mx.media)+" | "+fmt(mx.seed)+" | "+fmt(mx.total)+" | "+forTxt+" |");
  }));
  m.push("");

  const volOf = (l,pi,wi) => {
    if (strategy==="per-conc") return c.wellVol;
    const row = l.mixes[0].rows.filter(x => x.pi===pi && x.wi===wi)[0];
    return row ? row.vol : c.wellVol;
  };
  const topOf = (l,pi,wi) => {
    if (strategy==="per-conc") return 0;
    const row = l.mixes[0].rows.filter(x => x.pi===pi && x.wi===wi)[0];
    return row ? row.topUp : 0;
  };

  m.push("## What to put in each well"); m.push("");
  PLATES.forEach((p,pi) => {
    m.push("**Plate "+(pi+1)+" of "+PLATES.length+"**"); m.push("");
    m.push("| Well | Line | Mix (mL) | Top-up media (mL) | Cells |");
    m.push("| --- | --- | ---: | ---: | ---: |");
    p.forEach((w,wi) => {
      if (!w){ m.push("| "+(wi+1)+" | \u2014 | \u2014 | \u2014 | \u2014 |"); return; }
      const l = r.lines.filter(x => x.name===w.line)[0];
      const cellsN = wellCells(w,c.wellVol);
      const v = l ? volOf(l,pi,wi) : c.wellVol;
      const t = l ? topOf(l,pi,wi) : 0;
      m.push("| "+(wi+1)+" | "+w.line+" | "+fmt(v)+" | "+(t?fmt(t):"\u2014")+" | "+cellsN.toLocaleString("en-GB")+" |");
    });
    m.push("");
  });

  m.push("## Plate labels"); m.push("");
  PLATES.forEach((p,pi) => {
    const head = banner+" \u2014 plate "+(pi+1)+" of "+PLATES.length;
    m.push("| "+head+" |"+" |".repeat(c.cols-1));
    m.push("| "+Array(c.cols).fill("---").join(" | ")+" |");
    for (let rIdx=0; rIdx < c.n/c.cols; rIdx++){
      let row = "|";
      for (let k=0;k<c.cols;k++){
        const w = p[rIdx*c.cols+k];
        row += " "+(w ? (w.line+", "+fmtCells(wellCells(w,c.wellVol))) : "\u2014")+" |";
      }
      m.push(row);
    }
    m.push("");
  });

  m.push("## Record"); m.push("");
  r.lines.forEach(l => {
    const ws = l.wells;
    let h = "| "+l.name+" |", s = "| --- |";
    ws.forEach(w => { h += " P"+(w.pi+1)+"W"+(w.wi+1)+" |"; s += " ---: |"; });
    h += " unit |"; s += " --- |";
    m.push(h); m.push(s);
    m.push("| cells requirement |"+ws.map(w=>" "+w.cells.toLocaleString("en-GB")+" |").join("")+" cells |");
    m.push("| seed mix |"+ws.map(w=>" "+fmt(volOf(l,w.pi,w.wi))+" |").join("")+" mL |");
    m.push("| medium added |"+ws.map(w=>" "+(topOf(l,w.pi,w.wi)?fmt(topOf(l,w.pi,w.wi)):"0")+" |").join("")+" mL |");
    m.push("| total vol |"+ws.map(w=>" "+fmt(volOf(l,w.pi,w.wi)+topOf(l,w.pi,w.wi))+" |").join("")+" mL |");
    m.push("");
  });

  return m.join("\n");
}

function mdToHtml(md){
  const inl = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  let out=[], inT=false;
  md.split("\n").forEach(l => {
    if (/^\|/.test(l)){
      const cells = l.split("|").slice(1,-1);
      if (/^[\s:-]+$/.test(cells.join(""))) return;
      if (!inT){ out.push("<table><tr>"+cells.map(x=>"<th>"+inl(x.trim())+"</th>").join("")+"</tr>"); inT=true; }
      else out.push("<tr>"+cells.map(x=>{const t=x.trim();
        return '<td class="'+(/^[\d.,k\s\/mL]+$/.test(t)?"num":"")+'">'+inl(t)+"</td>";}).join("")+"</tr>");
      return;
    }
    if (inT){ out.push("</table>"); inT=false; }
    if (/^# /.test(l)) out.push("<h2>"+inl(l.slice(2))+"</h2>");
    else if (/^## /.test(l)) out.push("<h2>"+inl(l.slice(3))+"</h2>");
    else if (/^- /.test(l)) out.push('<p class="warn">\u2022 '+inl(l.slice(2))+"</p>");
    else if (l.trim()) out.push("<p>"+inl(l)+"</p>");
  });
  if (inT) out.push("</table>");
  return out.join("");
}

function run(){
  const r = compute();
  if (!r.lines.length){
    $("viewPane").innerHTML = '<p class="warn">Nothing to calculate. Each line needs a name and a master seed concentration, and at least one well must be assigned.</p>';
    $("md").value = ""; return;
  }
  const md = buildMarkdown(r);
  $("md").value = md;
  $("viewPane").innerHTML = mdToHtml(md);
}

$("excessMode").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  excessMode = b.dataset.v;
  $("excessMode").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v===excessMode)));
  $("exFactorWrap").classList.toggle("hidden", excessMode!=="factor");
  $("exVolWrap").classList.toggle("hidden", excessMode!=="volume");
};
$("strategy").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  strategy = b.dataset.v;
  $("strategy").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v===strategy)));
  $("stratnote").textContent = NOTES[strategy];
};
$("plate").onchange = () => { const parts = $("plate").value.split("|"); $("wellvol").value = parts[1]; renderPlates(); };
$("addline").onclick = () => { LINES.push({name:"",conc:0,mvol:0,media:MEDIA[0]}); renderLines(); };
$("addplate").onclick = () => { PLATES.push(new Array(cfg().n).fill(null)); renderPlates(); };
$("dlgMode").onclick = e => { const b = e.target.closest("button"); if (b) setDlgMode(b.dataset.v); };
$("dlgOk").onclick = () => {
  const v = parseFloat($("dlgVal").value);
  if (!v || v<=0){ alert("Enter a number greater than zero."); return; }
  const rep = Math.max(1, parseInt($("dlgRep").value,10)||1);
  const spec = {line:$("dlgLine").value, mode:dlgMode, val:v};
  const plate = PLATES[dlgTarget.pi];
  let placed = 0;
  for (let i = dlgTarget.wi; i < plate.length && placed < rep; i++){
    if (i === dlgTarget.wi || !plate[i]){ plate[i] = Object.assign({}, spec); placed++; }
  }
  $("dlgRep").value = 1;
  $("wellDlg").close(); renderPlates();
};
$("dlgClear").onclick = () => { PLATES[dlgTarget.pi][dlgTarget.wi] = null; $("wellDlg").close(); renderPlates(); };
$("dlgCancel").onclick = () => $("wellDlg").close();
$("calc").onclick = run;
$("reset").onclick = () => {
  LINES = [{name:"",conc:0,mvol:0,media:MEDIA[0]}];
  PLATES = [new Array(cfg().n).fill(null)];
  renderLines(); renderPlates();
  $("viewPane").innerHTML = '<p class="muted">Set up your plate and press Calculate.</p>';
  $("md").value = "";
};
$("tabView").onclick = () => { $("viewPane").classList.remove("hidden"); $("mdPane").classList.add("hidden"); $("tabView").setAttribute("aria-selected","true"); $("tabMd").setAttribute("aria-selected","false"); };
$("tabMd").onclick = () => { $("mdPane").classList.remove("hidden"); $("viewPane").classList.add("hidden"); $("tabView").setAttribute("aria-selected","false"); $("tabMd").setAttribute("aria-selected","true"); };
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("md").value); }
  catch(e) { const t=$("md"); t.removeAttribute("readonly"); t.select(); document.execCommand("copy"); t.setAttribute("readonly",""); }
  $("copy").textContent = "Copied"; setTimeout(()=>$("copy").textContent="Copy markdown",1500);
};
$("download").onclick = () => {
  const date = $("date").value || new Date().toISOString().slice(0,10);
  const who = ($("who").value.trim()||"seeding").replace(/\s+/g,"-");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("md").value],{type:"text/markdown"}));
  a.download = date+"-seeding-"+who+".md";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

           {line:"CP-A",mode:"count",val:125000},{line:"EPC2-hTERT",mode:"count",val:500000},
           {line:"EPC2-hTERT",mode:"count",val:180000},null]];
renderLines(); renderPlates(); run();
